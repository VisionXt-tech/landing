<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionXt - Rivoluzione nel Design d'Interni con l'IA</title>
    
    <!-- Google Fonts e Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- CSS Framework e Librerie -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/hero-fix.css">
</head>
<body class="bg-white">
    <!-- Contenitori per caricamento dinamico -->
    <div id="header-container"></div>
    <div id="mobile-menu-container"></div>
    <div id="hero-container"></div>
    <div id="data-strip1-container"></div>
    <div id="problem-container"></div>
    <div id="data-strip2-container"></div>
    <div id="solution-container"></div>
    <div id="data-strip3-container"></div>
    <div id="customers-container"></div>
    <div id="data-strip4-container"></div>
    <div id="advantages-container"></div>
    <div id="data-strip5-container"></div>
    <div id="business-container"></div>
    <div id="footer-container"></div>
    
    <script>
        // Funzione per caricare un componente HTML 
        async function loadComponent(url, containerId) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to load ${url}`);
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading component ${url}:`, error);
            }
        }

        // Carica tutti i componenti al caricamento della pagina
        document.addEventListener('DOMContentLoaded', async () => {
            // Carica i componenti
            await loadComponent('components/header.html', 'header-container');
            await loadComponent('components/mobile-menu.html', 'mobile-menu-container');
            await loadComponent('components/hero.html', 'hero-container');
            await loadComponent('components/data-strip.html', 'data-strip1-container');
            await loadComponent('components/problem.html', 'problem-container');
            await loadComponent('components/data-strip2.html', 'data-strip2-container');
            await loadComponent('components/solution.html', 'solution-container');
            await loadComponent('components/data-strip3.html', 'data-strip3-container');
            await loadComponent('components/customers.html', 'customers-container');
            await loadComponent('components/data-strip4.html', 'data-strip4-container');
            await loadComponent('components/advantages.html', 'advantages-container');
            await loadComponent('components/data-strip5.html', 'data-strip5-container');
            await loadComponent('components/business.html', 'business-container');
            await loadComponent('components/footer.html', 'footer-container');
            
            // Inizializza AOS per le animazioni
            AOS.init({
                duration: 700,
                easing: 'ease-out',
                once: true,
                offset: 50
            });
        });
    </script>
    <script src="js/counter-fix.js"></script>
</body>
</html>
